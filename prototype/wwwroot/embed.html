<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dafny Verify — embed</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #12161c;
    color: #d8dee9;
  }
  textarea {
    flex: 1;
    min-height: 120px;
    box-sizing: border-box;
    width: 100%;
    background: #151a21;
    color: #d8dee9;
    border: 0;
    border-bottom: 1px solid #262e3a;
    padding: 12px;
    font: inherit;
    resize: none;
    outline: none;
    tab-size: 2;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-weight: 650;
    color: #fff;
    background: #1f6feb;
    border: 1px solid #1f6feb;
    border-radius: 6px;
    padding: 6px 16px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  #verdict { font-weight: 650; }
  #verdict.ok { color: #7ce38b; }
  #verdict.bad { color: #ff7b72; }
  #status { color: #7d8896; font-size: 11px; flex: 1; min-width: 140px; }
  #open-full { margin-left: auto; color: #58a6ff; text-decoration: none; font-size: 11px; white-space: nowrap; }
  #open-full:hover { text-decoration: underline; }
  #problems { margin: 0; padding: 0 12px 10px 28px; overflow: auto; max-height: 34%; }
  #problems li { margin: 2px 0; color: #ffa198; }
  #problems li.warning { color: #d9b95c; }
</style>
</head>
<body>
<textarea id="source" spellcheck="false" aria-label="Dafny source"></textarea>
<div class="bar">
  <button id="verify" type="button" disabled>Verify</button>
  <span id="verdict"></span>
  <span id="status">first Verify downloads the verifier (~35 MB compressed) — cached afterwards</span>
  <a id="open-full" href="./" target="_blank" rel="noopener">Edit in Dafny Verify ↗</a>
</div>
<ul id="problems"></ul>
<script type="module" src="./embed.js"></script>
</body>
</html>
