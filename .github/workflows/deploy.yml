name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DAFNY_SHA: a04eea4dab324219e438f94ccc5ff0abcad11d86

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned Dafny and apply the browser-compat patch
        run: |
          git init upstream-dafny
          git -C upstream-dafny remote add origin https://github.com/dafny-lang/dafny.git
          git -C upstream-dafny fetch --depth 1 origin "$DAFNY_SHA"
          git -C upstream-dafny checkout FETCH_HEAD
          git -C upstream-dafny apply "$GITHUB_WORKSPACE/patches/dafny-browser-compat.patch"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install .NET WebAssembly workload
        run: dotnet workload install wasm-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DAFNY_SHA }}-${{ hashFiles('prototype/DafnyBrowser.csproj') }}

      - name: Build (bundle assets + publish .NET browser-wasm)
        working-directory: prototype
        run: |
          npm ci
          npm run build

      - name: Integration test — Dafny/Boogie WASM against Z3 WASM
        working-directory: prototype
        run: npm run test:wasm

      # Optional by design: embed.html (third-party iframes are never
      # cross-origin isolated) needs the single-threaded z3-st fallback.
      # continue-on-error keeps the deploy decoupled from z3-inline — if this
      # fails, the threaded demo still deploys and only the embed fallback is
      # absent.
      - name: Stage single-threaded Z3 for the embed/no-COI fallback (optional)
        continue-on-error: true
        env:
          Z3_INLINE_TAG: v0.3.0
        run: |
          mkdir -p prototype/dist/wwwroot/z3-st
          base="https://github.com/rupnikj/z3-inline/releases/download/$Z3_INLINE_TAG"
          curl -fL -o prototype/dist/wwwroot/z3-st/z3-st.js "$base/z3-st.js"
          curl -fL -o prototype/dist/wwwroot/z3-st/z3-st.wasm "$base/z3-st.wasm"
          curl -fL -o /tmp/z3-st-build-info.json "$base/build-info.json"
          expected=$(python3 -c "import json; print(json.load(open('/tmp/z3-st-build-info.json'))['wasmSha256'])")
          actual=$(sha256sum prototype/dist/wwwroot/z3-st/z3-st.wasm | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            rm -rf prototype/dist/wwwroot/z3-st
            echo "z3-st hash mismatch — embed fallback not staged"
            exit 1
          fi
          echo "z3-st $Z3_INLINE_TAG staged for the embed fallback: $actual"

      - name: Prepare Pages artifact
        run: touch prototype/dist/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: prototype/dist/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
